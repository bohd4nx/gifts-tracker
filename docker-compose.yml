services:
  db:
    image: postgres:16-alpine
    container_name: giftsTracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: giftsuser
      POSTGRES_PASSWORD: giftspass
      POSTGRES_DB: giftsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giftsuser -d giftsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: giftsTracker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://giftsuser:giftspass@db:5432/giftsdb
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

services:
  db:
    image: postgres:17-alpine
    container_name: gifts-tracker-db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gifts-tracker-app
    env_file:
      - .env
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
